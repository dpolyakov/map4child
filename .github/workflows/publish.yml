name: Update map

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map4child-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run editor:build
      - name: Read and prepare Google Sheets
        run: npm run data:sync
        env:
          GOOGLE_SHEET_URL: ${{ vars.GOOGLE_SHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Build the public site
        run: npm run build
        env:
          GOOGLE_SHEET_URL: ${{ vars.GOOGLE_SHEET_URL }}
          VITE_YANDEX_MAPS_API_KEY: ${{ vars.VITE_YANDEX_MAPS_API_KEY }}
          VITE_YANDEX_GEOCODER_API_KEY: ${{ vars.VITE_YANDEX_GEOCODER_API_KEY }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: .deploy-artifact
      - name: Commit the built site to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          site_dir="$RUNNER_TEMP/map4child-site"
          publish_dir="$RUNNER_TEMP/map4child-pages"
          mkdir -p "$site_dir"
          tar -xf .deploy-artifact/artifact.tar -C "$site_dir"
          remote_ref=$(git ls-remote --heads origin refs/heads/gh-pages)
          if [[ -n "$remote_ref" ]]; then
            git fetch origin gh-pages
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" checkout --orphan gh-pages
          fi
          rsync -a --delete --exclude=.git "$site_dir/" "$publish_dir/"
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish_dir" add --all
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "Publish build ${GITHUB_SHA:0:12}"
            git -C "$publish_dir" push origin HEAD:gh-pages
          fi
      - name: Deploy the same artifact to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
